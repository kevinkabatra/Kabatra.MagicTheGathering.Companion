name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

env:
  # The Cloudflare Pages project; the site is served at https://<name>.pages.dev.
  # Override with a repository variable named CLOUDFLARE_PAGES_PROJECT.
  PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'kabatra-mtg-companion' }}
  HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Check Cloudflare secrets
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning::Skipping the deploy. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets (see Hosting in the README)."

      - name: Publish
        run: dotnet publish src/Kabatra.MagicTheGathering.Companion -c Release -o publish

      # No extra files needed: with no top-level 404.html, Cloudflare Pages serves index.html
      # for any deep link, and it has browsers revalidate every file on each load.

      - name: Create the Pages project if it doesn't exist
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if ! npx --yes wrangler@3 pages project list | grep -qw "$PAGES_PROJECT"; then
            npx --yes wrangler@3 pages project create "$PAGES_PROJECT" --production-branch=main
          fi

      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy publish/wwwroot --project-name=${{ env.PAGES_PROJECT }} --branch=main
